services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: en-crypter-backend
    environment:
      PORT: "8000"
    expose:
      - "8000"
    networks:
      - encrypter-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: en-crypter-frontend
    depends_on:
      - backend
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    networks:
      - encrypter-net
    restart: unless-stopped

networks:
  encrypter-net:
    driver: bridge
